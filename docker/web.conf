log_format  custom  '[$time_iso8601]: $host $status $request_method $request_uri ,  remote_addr=[$remote_addr],  peer=[$realip_remote_addr],  x_forwarded_for=[$http_x_forwarded_for], user_agent=[$http_user_agent]';

# ip 连接数和请求数
limit_conn_zone $binary_remote_addr zone=web_per_ip:10m;
limit_req_zone $binary_remote_addr zone=web_ratelimit:20m rate=${LIMIT_REQ_RATE}r/s;
# 整站总连接数（$server_name 为当前 server 块的固定值，不受可伪造的 Host 头影响）
limit_conn_zone $server_name zone=web_per_server:10m;

limit_req_status 429;
limit_conn_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 开启请求头下划线
underscores_in_headers on;

server {
    listen 80;
    server_name _;

    access_log  /var/log/nginx/access.log custom buffer=32k flush=10s if=${NGINX_ACCESS_LOG_ENABLED};
    error_log  /var/log/nginx/error.log ${NGINX_ERROR_LOG_LEVEL};

    gzip on;
    gzip_static on;
    gzip_min_length  256;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
                application/json application/xml image/svg+xml font/ttf font/otf;
    gzip_vary on;
    gzip_proxied any;


    client_max_body_size ${CLIENT_MAX_BODY_SIZE};
    client_body_buffer_size ${CLIENT_BODY_BUFFER_SIZE};
    client_header_buffer_size ${CLIENT_HEADER_BUFFER_SIZE};
    large_client_header_buffers 4 32k;

    server_tokens off;

    # 安全响应头。子级 location 各自带了自己的 add_header（Cache-Control），
    # nginx 默认是覆盖式继承，必须用 merge 让子级追加而不是把这几条丢掉（需 nginx >= 1.29.3）
    add_header_inherit merge;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # 连接数限制
    limit_conn web_per_ip ${LIMIT_CONN};
    limit_conn web_per_server ${LIMIT_CONN_ALL};
    limit_req_log_level ${LIMIT_REQ_LOG_LEVEL};

    # 带宽限速
    limit_rate ${LIMIT_RATE};
    limit_rate_after ${LIMIT_RATE_AFTER};

    # 自定义 429 错误页面
    error_page 429 /429.html;
    location = /429.html {
        internal;
        return 429 'Too Many Requests';
    }

    # 自定义错误页：统一使用 /html/error.html（前端 public/error.html），避免暴露 nginx 默认页
    error_page 400 403 404 405 413 500 502 503 504 /error.html?code=$status;
    location = /error.html {
        internal;
        root /html;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/ {
      # 请求数限制：只限 API，避免首屏几十个静态资源被同一个桶排队
      limit_req zone=web_ratelimit burst=${LIMIT_REQ_BURST} ${LIMIT_REQ_BURST_MODE};

      proxy_pass ${PROXY_PASS};
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto http;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_connect_timeout 5s;
      proxy_next_upstream off;
      proxy_send_timeout ${PROXY_SEND_TIMEOUT};
      proxy_read_timeout ${PROXY_READ_TIMEOUT};

      # 反向代理限速
      proxy_limit_rate ${PROXY_LIMIT_RATE};
      # 反向代理是否开启缓冲，若流式返回需要设为off
      proxy_buffering ${PROXY_BUFFERING};
    }

    # WebSocket
    location /ws/ {
      proxy_pass ${PROXY_PASS};
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto http;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_send_timeout ${PROXY_SEND_TIMEOUT};
      proxy_read_timeout ${PROXY_READ_TIMEOUT};
    }

    # 构建产物（Vite 输出到 /assets/，文件名带 hash）：一年强缓存
    location ^~ /assets/ {
        root /html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 其余静态资源（public/ 下未 hash 的文件，如 logo/favicon/lottie）：短期缓存12小时
    location ~* \.(map|js|css|woff2?|ttf|otf|png|jpe?g|gif|svg|ico|webp|avif|lottie)$ {
        root /html;
        add_header Cache-Control "public, max-age=43200";
        access_log off;
    }

    location / {
      root /html;
      index index.html;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache" always;
      access_log off;
    }
}
