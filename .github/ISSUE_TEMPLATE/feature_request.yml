name: 功能建议
description: 提出一个新功能或改进想法
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。提交前请先搜索已有 Issue，避免重复。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 你遇到了什么问题？为什么现有能力不够用？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 相关链接、设计草图或其他上下文
    validations:
      required: false
