# Usage:
#   1. ⚠️ reset `your_rds_pwd`, `your_pg_pwd` and `your_jwt_secret`
#   2. run `docker compose -f docker-compose.prod.yml up --build`

services:
  pika-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    image: pika-server:latest
    restart: unless-stopped
    depends_on:
      pika-redis:
        condition: service_healthy
      pika-postgres:
        condition: service_healthy
    volumes:
      - pika_server_data:/data
    environment:
      - ADMIN_EMAIL=admin@example.com
      - JWT_ISSUER=pika
      - JWT_SECRET=your_jwt_secret # ⚠️ 修改 your_jwt_secret
      - CACHE_URL=redis://:your_rds_pwd@pika-redis:6379/0 # ⚠️ 修改 your_rds_pwd
      - DATABASE_URL=postgresql://pika:your_pg_pwd@pika-postgres:5432/pika # ⚠️ 修改 your_pg_pwd
      - MULTI_PROCESS_MODE_ENABLED=true # 可选，启用多进程模式，仅当pgsql+redis+显式开启，才使用多进程模式
      # 更多配置查看 apps/server/.env.example 文件
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9528/api/health']
      interval: 5s
      timeout: 3s
      retries: 3
    logging: # 限制日志体量，避免长期运行吃满宿主机磁盘
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  pika-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: pika-web:latest
    restart: unless-stopped
    depends_on:
      pika-server:
        condition: service_healthy
    ports:
      - 8080:80
    environment:
      - PROXY_PASS=http://pika-server:9528
      - REAL_IP_FROM=172.16.0.0/12,10.0.0.0/8 # 逗号分隔，填写实际代理/CDN 回源网段
      # 以下为可选参数
      - CLIENT_MAX_BODY_SIZE=256m # 请求体大小上限，后端 REQUEST_MAX_BODY_SIZE 默认也是256m
      - PROXY_BUFFERING=on # 反向代理是否开启缓冲, 若流式返回需要设为off
      - LIMIT_CONN=40 # 每个 IP 最大连接数
      - LIMIT_CONN_ALL=1000 # 总连接数
      - LIMIT_REQ_RATE=40 # 每个 IP 每秒请求数
      - LIMIT_REQ_BURST=20 # 允许突发数
      - LIMIT_RATE=512k # 每个连接带宽限速
      - LIMIT_RATE_AFTER=10m # 前 10MB 不限速
      # 更多参数查看 docker/README.md
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/index.html']
      interval: 5s
      timeout: 3s
      retries: 3

  pika-redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=your_rds_pwd # ⚠️ 修改 your_rds_pwd
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - pika_redis_data:/data
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'sh', '-c', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping']
      interval: 5s
      timeout: 3s
      retries: 3

  pika-postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    volumes:
      - pika_postgres_data:/var/lib/postgresql
    shm_size: 256mb
    environment:
      POSTGRES_DB: pika
      POSTGRES_USER: pika
      POSTGRES_PASSWORD: your_pg_pwd # ⚠️ 修改 your_pg_pwd
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  # Please back up the database regularly.
  pika_server_data:
  pika_redis_data:
  pika_postgres_data:

  # Or use local driver
  # pika_server_data:
  #   driver: local
  #   driver_opts:
  #     device: /root/pika_volumes/pika_server_data
  #     o: bind
  #     type: none
